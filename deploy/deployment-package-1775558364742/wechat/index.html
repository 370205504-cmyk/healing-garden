<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌿 治愈花园 - 沉浸式种植体验</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #E8F5E9; }
        #gameContainer { width: 100%; height: 100%; position: relative; }
        #gameCanvas { display: block; background: #E8F5E9; }
        .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #81C784 0%, #4CAF50 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .loading-icon { font-size: 64px; animation: bounce 1.5s infinite; }
        .loading-title { font-size: 28px; color: white; margin-top: 20px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .loading-subtitle { font-size: 14px; color: rgba(255,255,255,0.8); margin-top: 10px; }
        .loading-bar { width: 240px; height: 12px; background: rgba(255,255,255,0.3); border-radius: 6px; margin-top: 30px; overflow: hidden; }
        .loading-progress { height: 100%; background: linear-gradient(90deg, #FFEB3B, #FFC107); border-radius: 6px; transition: width 0.3s ease; }
        .loading-text { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 10px; }
        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 24px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; border: none; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: rgba(255,255,255,0.9); color: #666; border: 1px solid #E0E0E0; }
        .btn-secondary:hover { background: #F5F5F5; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <!-- 加载界面 -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-icon" style="animation: bounce 1.5s infinite;">🌱</div>
            <div class="loading-title">治愈花园</div>
            <div class="loading-subtitle">沉浸式种植体验</div>
            <div class="loading-bar">
                <div class="loading-progress" id="loadingProgress" style="width: 0%"></div>
            </div>
            <div class="loading-text" id="loadingText">正在初始化...</div>
        </div>
        
        <!-- 游戏画布 -->
        <canvas id="gameCanvas" width="375" height="667"></canvas>
    </div>
    
    <script type="module" src="game.js"></script>
</body>
</html>
