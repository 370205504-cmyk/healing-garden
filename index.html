<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自动治愈花园 - Healing Garden</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, 'Segoe UI', sans-serif;
        }
        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 9 / 16;
        }
        #game-wrapper canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        @media (min-width: 480px) {
            #game-wrapper {
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 0 40px rgba(0,0,0,0.5);
            }
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>
    <script src="src/game.js"></script>
</body>
</html>
